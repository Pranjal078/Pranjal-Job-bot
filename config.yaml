# ============================================================
#  Job Search Alert Bot — Configuration
#  Edit this file to change your criteria. No code changes needed.
# ============================================================

# --------------- SOURCE TOGGLES ---------------
sources:
  remoteok: true
  weworkremotely: true
  gulf: false             # Set false (abroad roles will be handled by a separate bot)
  wellfound: false        # Stub — API unavailable; set true when/if it returns
  naukri: false           # Stub — no public API; set true if implemented
  company_careers: true
  linkedin_email: true    # Requires Gmail API creds (see README)

# --------------- COMPANY CAREER PAGES ---------------
# Add or remove companies here. Each entry needs a `name` and a `type`.
# Supported types:
#   Workday: wells_fargo, mastercard, walmart, citi, barclays, deutsche_bank, paypal, fractal, genpact, target
#   Oracle HCM: amex, jpmc
#   SmartRecruiters: visa, freshworks, wns, swiggy, phonepe
#   Greenhouse: razorpay
#   Workable: tiger
#
# Skipped (no public unauthenticated search API):
#   HSBC (Eightfold/SuccessFactors), Standard Chartered (Taleo), Goldman Sachs (SSO),
#   LatentView (WordPress forms), ZS Associates (Jibe), Mu Sigma (email),
#   EXL Service (DNS/no unauth API), Flipkart/Myntra/Meesho/CRED (closed apps), Zomato (referral only)
company_targets:
  # Priority 1: Banks / Global Financial Services
  - name: Wells Fargo
    type: wells_fargo
    enabled: true
  - name: American Express
    type: amex
    enabled: true
  - name: JPMorgan Chase
    type: jpmc
    enabled: true
  - name: Mastercard
    type: mastercard
    enabled: true
  - name: Citi
    type: citi
    enabled: true
  - name: Barclays
    type: barclays
    enabled: true
  - name: Deutsche Bank
    type: deutsche_bank
    enabled: true
  - name: Visa
    type: visa
    enabled: true
  - name: PayPal
    type: paypal
    enabled: true

  # Global Tech & Retail
  - name: Walmart Global Tech
    type: walmart
    enabled: true
  - name: Target
    type: target
    enabled: true

  # Analytics & IT Consulting
  - name: Fractal Analytics
    type: fractal
    enabled: true
  - name: Tiger Analytics
    type: tiger
    enabled: true
  - name: Genpact
    type: genpact
    enabled: true
  - name: WNS
    type: wns
    enabled: true
  - name: Freshworks
    type: freshworks
    enabled: true

  # Indian Tech Unicorns & FinTech
  - name: PhonePe
    type: phonepe
    enabled: true
  - name: Razorpay
    type: razorpay
    enabled: true
  - name: Swiggy
    type: swiggy
    enabled: true


# --------------- FILTER CRITERIA ---------------
filters:
  # Job title must contain at least one of these keywords (case-insensitive)
  title_keywords:
    - Business Analyst
    - Product Analyst
    - Analytics Consultant
    - FinOps Analyst
    - Data Analyst
    - Analyst
    - Consultant

  # Location filter — focused strictly on India locations and Remote
  locations:
    - Remote
    - remote
    - India
    - Gurgaon
    - Gurugram
    - NCR
    - New Delhi
    - Delhi
    - Mumbai
    - Bangalore
    - Bengaluru
    - Hyderabad
    - Pune
    - Chennai
    - Noida
    - Kolkata

  # Target experience level in years (~3 years experience)
  target_experience_years: 3

  # Compensation floor — flag (not exclude) if listed comp >= this value (in INR LPA equivalent)
  # Set to null to disable comp flagging
  comp_floor_lpa: 10

  # Maximum age of listings in days — older listings are discarded
  max_age_days: 7

  # Title exclusions — skip if title contains any of these (case-insensitive)
  exclude_title_keywords:
    - Senior Manager
    - Director
    - VP
    - Vice President
    - Head of
    - Chief
    - Principal Manager
    - Managing Director
    - C-Level
    - Intern
    - Internship
    - Graduate Program
    - Training Program
    - Early Career
    - Student
    - Trainee
    - Fresher

# --------------- NOTIFICATION ---------------
notification:
  # Primary channel: "telegram" or "email"
  channel: telegram

  telegram:
    # Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in .env or GitHub secrets
    max_jobs_per_message: 10    # Telegram has a 4096-char limit per message
    parse_mode: HTML            # HTML or Markdown

  email:
    # Used as fallback if Telegram token is absent
    # Set SMTP_USER and SMTP_PASSWORD in .env or GitHub secrets
    smtp_host: smtp.gmail.com
    smtp_port: 587
    from_addr: ""               # e.g. yourname@gmail.com
    to_addr: ""                 # where to send the digest

# --------------- SCHEDULING ---------------
schedule:
  # GitHub Actions cron expression (UTC)
  # 0 6 * * * = 06:00 UTC = 11:30 AM IST
  cron: "0 6 * * *"

# --------------- DATABASE ---------------
database:
  path: jobs.db   # SQLite file path (relative to project root)

# --------------- LOGGING ---------------
logging:
  level: INFO     # DEBUG, INFO, WARNING, ERROR
