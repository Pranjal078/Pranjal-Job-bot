name: Daily Job Alert

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print digest only, no Telegram, no DB write)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      source:
        description: 'Test a single source (leave blank for all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - remoteok
          - weworkremotely
          - company_careers
          - linkedin_email

jobs:
  job-alert:
    name: Run Job Alert Bot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Gmail token
        run: echo '${{ secrets.GMAIL_TOKEN_JSON }}' > token.json

      - name: Write Gmail credentials
        run: echo '${{ secrets.GMAIL_CREDENTIALS_JSON }}' > credentials.json

      - name: Restore jobs database
        uses: actions/cache@v4
        with:
          path: jobs.db
          key: jobs-db-${{ hashFiles('config.yaml') }}-${{ github.run_number }}
          restore-keys: |
            jobs-db-${{ hashFiles('config.yaml') }}-

      - name: Run job alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          GMAIL_TOKEN_PATH: token.json
          GMAIL_CREDENTIALS_PATH: credentials.json
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.source }}" ]; then
            ARGS="$ARGS --source ${{ github.event.inputs.source }}"
          fi
          python main.py $ARGS

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-alert-log-${{ github.run_number }}
          path: jobs.db
          retention-days: 7
